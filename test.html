<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>EDUNEST IELTS · Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#141B2D;--ink2:#2A3756;--red:#E3101F;--red-d:#B80C18;--mist:#EEF1F6;--slate:#5A6378;--line:#DCE1EA;--paper:#fff;--ok:#0E8A4F;--okbg:#E4F5EC;--bad:#C4121D;--badbg:#FDE8E9;--hl:#FFE58A;--fs:16px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--mist);font-size:var(--fs);-webkit-text-size-adjust:100%}
body.dark{--ink:#F2F4F8;--paper:#11151F;--mist:#0A0D14;--line:#2A3242;--slate:#A9B2C3;--okbg:#0F2E20;--badbg:#3A1216;--hl:#6B5A10}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2F6FEB;outline-offset:2px}
.hide{display:none!important}

/* ----- screens ----- */
.screen{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:620px;background:var(--paper);border-radius:22px;padding:28px 24px;box-shadow:0 1px 0 rgba(20,27,45,.05)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--red);text-decoration:none}
.brand img{width:40px;height:40px;object-fit:contain}
.brand small{display:block;color:var(--slate);font-weight:600;font-size:12.5px}
.card h1{margin:18px 0 6px;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.facts div{background:var(--mist);border-radius:14px;padding:12px}
.facts b{display:block;font-size:22px}.facts small{color:var(--slate);font-weight:600;font-size:13px}
.rules{margin:0 0 18px;padding-left:20px;line-height:1.6;color:var(--slate);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.wide{width:100%}
.prog{height:8px;border-radius:8px;background:var(--mist);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.muted{color:var(--slate)}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--red);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ----- exam shell ----- */
#exam{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.top{display:flex;align-items:center;gap:12px;height:58px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--paper)}
.top .brand img{width:30px;height:30px}.top .brand span{font-size:15px}
.who{font-size:13.5px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
.timer{margin:0 auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;background:var(--mist);font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
.timer.warn{background:var(--badbg);color:var(--bad)}
.tools{display:flex;gap:6px;align-items:center}
.ib{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vol{display:flex;align-items:center;gap:6px}.vol input{width:90px;accent-color:var(--red)}
.banner{background:var(--ink);color:#fff;padding:9px 16px;font-size:14px;font-weight:600;text-align:center}
.banner.red{background:var(--red)}
.ptitle{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--mist)}
.ptitle b{font-size:17px}.ptitle span{color:var(--slate);font-size:14px;margin-left:8px}
.body{flex:1;min-height:0;display:flex}
.pane{flex:1;min-width:0;overflow:auto;padding:22px 26px 60px;line-height:1.7}
.pane.passage{background:var(--paper)}
.pane.qs{background:var(--paper)}
.split .pane.passage{flex:0 0 var(--left,50%)}
.divider{flex:0 0 10px;cursor:col-resize;background:var(--mist);display:grid;place-items:center;touch-action:none}
.divider::after{content:"";width:3px;height:44px;border-radius:3px;background:var(--line)}
.mtabs{display:none}

/* passage + question typography */
.passage h3{font-size:1.35em;margin:.3em 0 .4em;line-height:1.25}
.passage p{margin:.2em 0 1em;text-align:left}
.passage strong:first-child{font-weight:800}
.qs table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.95em}
.qs th,.qs td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:middle}
.qs th{background:var(--mist);font-weight:700}
.qs td input[type=radio]{display:block;margin:0 auto}
[data-k=group]{margin:0 0 26px}
[data-k=gtitle]{font-weight:800;font-size:1.05em;margin-bottom:6px}
[data-k=q]{padding:12px 0;border-bottom:1px dashed var(--line)}
[data-k=qtext]{font-weight:600;margin-bottom:8px}
[data-k=opts]{display:grid;gap:6px}
[data-k=opts] label{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;line-height:1.45}
[data-k=opts] label:has(input:checked){border-color:var(--ink);background:var(--mist)}
input[type=radio]{width:19px;height:19px;accent-color:var(--red);flex:none;margin-top:2px}
[data-k=row]{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 0}
input.gap{min-width:120px;width:11em;max-width:100%;height:36px;padding:0 10px;border:1.5px solid #9AA3B5;border-radius:8px;background:var(--paper);font-size:.95em;font-weight:600;vertical-align:middle;margin:2px 3px}
input.gap:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(47,111,235,.18)}
input.gap::placeholder,input.gap.ph{color:var(--slate);font-weight:700}
select[data-k=pick]{height:38px;border:1.5px solid #9AA3B5;border-radius:8px;padding:0 10px;background:var(--paper);font-weight:700;margin-left:8px}
[data-k=match]{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}
[data-k=match]>div>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
[data-k=mtitle]{font-weight:800;margin-bottom:6px}
ul[data-k=list]{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul[data-k=list] li{padding:8px 12px;border-radius:10px;background:var(--mist);font-size:.95em}
.qnum{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;border-radius:7px;background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:800;margin-right:4px}
mark.hl{background:var(--hl);color:inherit;border-radius:3px;cursor:pointer}
.hlbtn{position:fixed;z-index:60;padding:8px 12px;border-radius:10px;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.cur{background:rgba(47,111,235,.07);border-radius:8px}

/* ----- bottom navigator ----- */
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line);background:var(--paper)}
.parts{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
.part{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:12px;flex:none}
.part>button{border:0;background:transparent;font-weight:800;font-size:14px;padding:6px 6px;cursor:pointer;white-space:nowrap}
.part .cnt{font-size:12.5px;color:var(--slate);font-weight:600}
.part.on{background:var(--mist)}
.nums{display:none;gap:4px}
.part.on .nums{display:flex}.part.on .cnt{display:none}
.num{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;cursor:pointer;padding:0}
.num.ans{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.num.now{box-shadow:0 0 0 2px var(--red)}
.num.right{background:var(--ok);border-color:var(--ok);color:#fff}.num.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.arrows{display:flex;gap:6px}
.submit{height:42px;padding:0 16px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;cursor:pointer;white-space:nowrap}

/* ----- review marks ----- */
.ok-in{border-color:var(--ok)!important;background:var(--okbg)!important}
.bad-in{border-color:var(--bad)!important;background:var(--badbg)!important}
.key{display:inline-block;margin:0 4px;padding:2px 8px;border-radius:7px;background:var(--ok);color:#fff;font-size:.8em;font-weight:800;vertical-align:middle}
label.key-opt{border-color:var(--ok)!important;background:var(--okbg)!important}
label.bad-opt{border-color:var(--bad)!important;background:var(--badbg)!important}
td.key-cell{background:var(--okbg)}td.bad-cell{background:var(--badbg)}

/* ----- modal ----- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,13,20,.55);display:grid;place-items:center;padding:16px}
.modal .card{max-width:440px}
.modal h2{margin:0 0 6px;font-size:22px}
.row2{display:flex;gap:10px;margin-top:18px}.row2 .btn{flex:1}

/* ----- results ----- */
.res{max-width:760px}
.band{display:flex;align-items:center;gap:20px;margin:18px 0}
.band .b{width:116px;height:116px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;flex:none}
.band .b b{font-size:40px;line-height:1}.band .b small{display:block;font-size:12px;opacity:.75;font-weight:600}
.band p{margin:0;line-height:1.5}
.pscores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pscores div{background:var(--mist);border-radius:14px;padding:12px}.pscores b{font-size:20px;display:block}.pscores small{color:var(--slate);font-weight:600}
.saved{font-size:13.5px;color:var(--slate);margin-top:12px}
.reviewbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--okbg);border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.reviewbar audio{height:36px;flex:1;max-width:520px}
.reviewbar .btn{min-height:38px;padding:0 14px;font-size:14px}

/* ----- options popover ----- */
.opts{position:fixed;top:64px;right:12px;z-index:70;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;width:250px;box-shadow:0 16px 40px rgba(0,0,0,.18)}
.opts h4{margin:0 0 8px;font-size:13px;color:var(--slate)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

@media(max-width:860px){
  .top{gap:8px;padding:0 8px}.who,.top .brand span{display:none}.vol input{width:64px}
  .split{flex-direction:column}.split .pane.passage{flex:1}.divider{display:none}
  .mtabs{display:flex;border-bottom:1px solid var(--line)}
  .mtabs button{flex:1;height:44px;border:0;background:var(--paper);font-weight:800;border-bottom:3px solid transparent;cursor:pointer}
  .mtabs button.on{border-bottom-color:var(--red)}
  .split.show-q .pane.passage,.split:not(.show-q) .pane.qs{display:none}
  .pane{padding:16px 14px 70px}
  .nav{flex-wrap:wrap}.parts{order:2;flex-basis:100%}
  .facts{grid-template-columns:1fr 1fr 1fr}.pscores{grid-template-columns:repeat(2,1fr)}
  [data-k=match]{grid-template-columns:1fr}
}
@media print{body{display:none}}
</style>
</head>

async function decrypt(buf){
  if(String.fromCharCode(...buf.slice(0,4))!=='EDN1')throw new Error('bad');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(IK),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:buf.slice(4,20),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(20,32)},key,buf.slice(32)));
}
async function fetchBin(name,onp){
  const r=await fetch(name+'.bin',{cache:'no-cache'});if(!r.ok)throw new Error('net');
  const total=+r.headers.get('content-length')||0;if(!r.body||!total||!onp)return new Uint8Array(await r.arrayBuffer());
  const rd=r.body.getReader();const chunks=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;chunks.push(value);got+=value.length;onp(got/total)}
  const out=new Uint8Array(got);let o=0;for(const c of chunks){out.set(c,o);o+=c.length}return out;
}

async function boot(){
  if(!T){fail('Test topilmadi','Havola noto‘g‘ri. Bosh sahifadan testni tanlang.','./#/me','Bosh sahifa');return}
  if(!S){fail('Avval kiring','Testni ishlash uchun Telegram orqali kiring — 10 soniya.','./#/login','Telegram orqali kirish');return}
  let me=null;try{me=await fetch(CLOUD_URL+'?'+new URLSearchParams({action:'ime',id:S.uid,t:S.t})).then(r=>r.json())}catch(e){}
  if(!me){fail('Internet yo‘q','Ulanishni tekshirib, sahifani yangilang.','javascript:location.reload()','Qayta urinish');return}
  if(!me.ok||!me.ik){ls.set('session',null);fail('Qayta kiring','Kirish muddati tugagan. Telegram orqali qayta kiring.');return}
  IK=me.ik;USER=me.user;
  try{DOC=JSON.parse(new TextDecoder().decode(await decrypt(await fetchBin(T.file))))}catch(e){fail('Yuklanmadi','Testni ochib bo‘lmadi. Sahifani yangilang.','javascript:location.reload()','Qayta urinish');return}
  document.title='EDUNEST IELTS · '+DOC.title;
  const saved=loadState();
  intro(saved);
}

function renderParts(){
  $('#parts').innerHTML=DOC.parts.map((p,i)=>{const nums=[];for(let q=p.from;q<=p.to;q++)nums.push(q);
    return `<div class="part" data-i="${i}"><button data-p="${i}">${p.title}</button><span class="cnt" id="cnt${i}"></span><div class="nums">${nums.map(q=>`<button class="num" data-n="${q}" aria-label="Question ${q}">${q}</button>`).join('')}</div></div>`}).join('');
  $$('#parts [data-p]').forEach(b=>b.onclick=()=>showPart(+b.dataset.p));
  $$('#parts .num').forEach(b=>b.onclick=()=>goQ(+b.dataset.n));
  paintNav();
}
function showPart(i){

  $('#ptitle').innerHTML=`<b>${T.kind==='listening'?p.title.toUpperCase():'READING '+p.title.toUpperCase()}</b><span>${p.sub?esc(p.sub)+' · ':''}Questions ${p.from}–${p.to}</span>`;

function wire(){
  $$('#pq input.gap').forEach(i=>{const n=i.dataset.q;i.placeholder=n;i.value=A[n]||'';
    i.oninput=()=>{A[n]=i.value;saveState();paintNav()};i.onfocus=()=>setCur(+n);
    i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();stepQ(1)}}});
  $$('#pq select[data-k=pick]').forEach(s=>{const n=s.dataset.q;s.value=A[n]||'';s.onchange=()=>{A[n]=s.value;saveState();paintNav()};s.onfocus=()=>setCur(+n)});
  $$('#pq input[type=radio]').forEach(r=>{const n=r.name.slice(1);r.checked=A[n]===r.value;r.onchange=()=>{A[n]=r.value;saveState();paintNav();setCur(+n)}});

function elFor(n){return $(`#pq [data-q="${n}"]`)||$(`#pq [data-n="${n}"]`)||($(`#pq input[name="q${n}"]`)||{}).closest&&$(`#pq input[name="q${n}"]`).closest('tr,[data-k=q],label')}

function goQ(n){const i=partOf(n);if(i!==ui.part)showPart(i);

  const el=elFor(n);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});const f=el.matches('input,select')?el:el.querySelector('input,select');if(f&&ui.mode==='exam')setTimeout(()=>f.focus({preventScroll:true}),250)}

function modal(html){const m=$('#modal');m.innerHTML=`<div class="card">${html}</div>`;m.classList.remove('hide');m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){$('#modal').classList.add('hide')}
function confirmSubmit(){let miss=0;for(let q=1;q<=40;q++)if(!answered(q))miss++;
  modal(`<h2>Testni topshirasizmi?</h2><p class="muted">${miss?`<b>${miss} ta savol</b> javobsiz qoldi. Topshirgandan keyin javoblarni o‘zgartirib bo‘lmaydi.`:'Barcha savollarga javob berdingiz.'}</p>
    <div class="row2"><button class="btn line" id="mNo">Qaytish</button><button class="btn" id="mYes">Topshirish</button></div>`);
  $('#mNo').onclick=closeModal;$('#mYes').onclick=()=>{closeModal();submit(false)}}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function isOk(n){const v=A[n];if(!answered(n))return false;return DOC.answers[n].some(a=>norm(a)===norm(v))}
function submit(auto){
  clearInterval(ui.tick);ui.mode='done';if(audio){audio.pause()}
  const ok={};let raw=0;for(let q=1;q<=40;q++){ok[q]=isOk(q);if(ok[q])raw++}
  const parts=DOC.parts.map(p=>{let c=0;for(let q=p.from;q<=p.to;q++)if(ok[q])c++;return c});
  const b=band(T.kind,raw),mins=Math.round((Date.now()-ui.start)/60000);
  RESULT={raw,band:b,ok,parts,mins,auto};ls.set(stKey(),null);
  results();save();
}
async function save(){const body={action:'ires',id:S.uid,t:S.t,test:TID,raw:RESULT.raw,band:RESULT.band,parts:RESULT.parts,mins:RESULT.mins,ans:A};
  for(let i=0;i<3;i++){try{const j=await fetch(CLOUD_URL,{method:'POST',body:JSON.stringify(body)}).then(r=>r.json());if(j.ok){const s=$('#saved');if(s)s.textContent='Natija profilingizga saqlandi ✓';return}}catch(e){}await new Promise(r=>setTimeout(r,1500))}
  const s=$('#saved');if(s)s.textContent='Natijani saqlab bo‘lmadi — internetni tekshiring.'}
function results(){
  const r=RESULT,L=T.kind==='listening';
  const msg=r.band>=7.5?'Ajoyib natija! Bu daraja ko‘plab universitetlar talabidan yuqori.':r.band>=6.5?'Yaxshi natija. Xatolarni tahlil qilsangiz, keyingi bosqichga yaqinsiz.':r.band>=5.5?'Yomon emas. Xatolaringizni javoblar bilan birga ko‘rib chiqing.':'Boshlanish nuqtasi shu. Xatolarni tahlil qilish — eng tez o‘sish yo‘li.';
  screen(`${brandHTML()}<h1>${esc(DOC.title)} — natija</h1>
    <div class="band"><div class="b"><div><b>${r.band.toFixed(1)}</b><small>Band</small></div></div><p><b>${r.raw} / 40</b> to‘g‘ri javob${r.auto?' · vaqt tugadi':''}<br><span class="muted">${msg}</span></p></div>
    <div class="pscores">${DOC.parts.map((p,i)=>`<div><b>${r.parts[i]} / ${p.to-p.from+1}</b><small>${p.title}</small></div>`).join('')}</div>
    <p class="saved" id="saved">Natija saqlanmoqda…</p>
    <div class="row2"><button class="btn ink" id="rv">Javoblarni ko‘rib chiqish</button><a class="btn line" href="./#/me">Bosh sahifa</a></div>
    ${L?'<p class="muted" style="font-size:14px;margin-top:14px">Maslahat: ko‘rib chiqishda audioni qayta tinglab, xato qilgan joylaringizni toping — bepul qo‘llanmadagi usul aynan shu.</p>':''}`);
  $('#screen .card').classList.add('res');
  $('#rv').onclick=review;
}
function review(){
  ui.mode='review';$('#screen').classList.add('hide');$('#exam').classList.remove('hide');
  $('#timer').textContent=RESULT.raw+' / 40 · Band '+RESULT.band.toFixed(1);$('#timer').classList.remove('warn');$('#ban').innerHTML='';
  $('#sub').textContent='Bosh sahifa';
  $('#rbar').innerHTML=`<div class="reviewbar"><span>Ko‘rib chiqish rejimi</span>${T.kind==='listening'&&audioUrl?`<audio controls src="${audioUrl}"></audio>`:''}<button class="btn ink" id="toRes">Natija</button></div>`;
  $('#toRes').onclick=()=>{const a=$('#rbar audio');if(a)a.pause();results();save=()=>{};$('#saved').textContent=''};
  showPart(0);
}
function mark(){
  $$('#pq input, #pq select').forEach(x=>x.disabled=true);
  for(let n=DOC.parts[ui.part].from;n<=DOC.parts[ui.part].to;n++){
    const ok=RESULT.ok[n],key=DOC.answers[n][0];
    const g=$(`#pq input.gap[data-q="${n}"], #pq select[data-k=pick][data-q="${n}"]`);
    if(g){g.classList.add(ok?'ok-in':'bad-in');if(!ok&&!g.nextElementSibling?.classList?.contains('key'))g.insertAdjacentHTML('afterend',`<span class="key">${esc(key)}</span>`);continue}
    const radios=$$(`#pq input[name="q${n}"]`);
    radios.forEach(r=>{const cell=r.closest('label')||r.closest('td');if(!cell)return;
      if(norm(r.value)===norm(key))cell.classList.add(cell.tagName==='TD'?'key-cell':'key-opt');
      else if(r.checked)cell.classList.add(cell.tagName==='TD'?'bad-cell':'bad-opt')});
  }
}
addEventListener('beforeunload',e=>{if(ui.mode==='exam'&&ui.start){saveState();e.preventDefault();e.returnValue=''}});
addEventListener('hashchange',()=>location.reload());
boot();
</script>
